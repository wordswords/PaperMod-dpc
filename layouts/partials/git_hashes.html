{{- /* Output git hashes from the site's data/git_hashes.json */ -}}
{{- with .Site.Data.git_hashes -}}
    {{- if reflect.IsMap . -}}
        {{- range $repo, $hash := . -}}
            <meta name="git-hash" content="{{ $repo }}: {{ $hash }}">
        {{- end -}}
    {{- else -}}
        <meta name="git-hash" content="{{ . }}">
    {{- end -}}
{{- end -}}
