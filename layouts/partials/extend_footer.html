{{- /* Footer custom content area start */ -}}
<script>
    const gitHashesElement = document.getElementById('git-hashes');
    if (gitHashesElement) {
        Promise.all([
            fetch('{{ "git_hashes.json" | relURL }}').then(response => {
                if (!response.ok) throw new Error('Failed to fetch git hashes');
                return response.json();
            }),
            fetch('{{ "github-repo.json" | relURL }}').then(response => {
                if (!response.ok) throw new Error('Failed to fetch GitHub repository');
                return response.json();
            }).catch(() => null)
        ])
            .then(([data, githubRepo]) => {
                const theme = data.theme;
                const site = data.site;
                const parts = [];
                if (theme && theme.commit) {
                    const themeLink = document.createElement('a');
                    themeLink.href = 'https://github.com/wordswords/PaperMod-dpc/commit/' + encodeURIComponent(theme.commit);
                    themeLink.textContent = theme.commit;
                    themeLink.rel = 'noopener noreferrer';
                    themeLink.target = '_blank';
                    const themePart = document.createDocumentFragment();
                    themePart.append('Theme: ', themeLink, theme.tag ? ' (' + theme.tag + ')' : '');
                    parts.push(themePart);
                }
                if (site && site.commit) {
                    const sitePart = document.createDocumentFragment();
                    const repo = githubRepo && githubRepo.repo;
                    if (typeof repo === 'string' && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) {
                        const siteLink = document.createElement('a');
                        siteLink.href = 'https://github.com/' + repo + '/commit/' + encodeURIComponent(site.commit);
                        siteLink.textContent = site.commit;
                        siteLink.rel = 'noopener noreferrer';
                        siteLink.target = '_blank';
                        sitePart.append('Site: ', siteLink);
                    } else {
                        sitePart.append('Site: ' + site.commit);
                    }
                    if (site.tag) sitePart.append(' (' + site.tag + ')');
                    parts.push(sitePart);
                }
                if (parts.length > 0) {
                    gitHashesElement.replaceChildren();
                    parts.forEach(part => gitHashesElement.append(' · ', part));
                }
            })
            .catch(() => {
                gitHashesElement.textContent = ' · Hashes not found.';
            });
    }
</script>
{{- /* Footer custom content area end */ -}}
