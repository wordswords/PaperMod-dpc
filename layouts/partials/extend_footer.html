<script>
    const gitHashesElement = document.getElementById('git-hashes');
    if (gitHashesElement) {
        fetch('/git_hashes.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch git hashes');
                return response.json();
            })
            .then(data => {
                const theme = data.theme;
                const site = data.site;
                const parts = [];
                if (theme && theme.commit) {
                    const themeLink = document.createElement('a');
                    themeLink.href = 'https://github.com/wordswords/PaperMod-dpc/commit/' + encodeURIComponent(theme.commit);
                    themeLink.textContent = theme.commit;
                    themeLink.rel = 'noopener noreferrer';
                    themeLink.target = '_blank';
                    const themePart = document.createDocumentFragment();
                    themePart.append('Theme: ', themeLink, theme.tag ? ' (' + theme.tag + ')' : '');
                    parts.push(themePart);
                }
                if (site && site.commit) {
                    parts.push('Site: ' + site.commit + (site.tag ? ' (' + site.tag + ')' : ''));
                }
                if (parts.length > 0) {
                    gitHashesElement.replaceChildren();
                    parts.forEach(part => gitHashesElement.append(' · ', part));
                }
            })
            .catch(() => {
                gitHashesElement.textContent = ' · Hashes not found.';
            });
    }
</script>
{{- /* Footer custom content area end */ -}}
